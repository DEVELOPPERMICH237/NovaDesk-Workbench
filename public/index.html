<script>
  try {
    const savedTheme = localStorage.getItem("novadesk-theme");
    document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark"
      ? savedTheme
      : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch {}
</script>
